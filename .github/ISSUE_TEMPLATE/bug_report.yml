name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please remove passwords, server addresses and usernames from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown next to the app name at the top of the window, e.g. 2.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2 or Windows 10 22H2
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: Open the Debug Log panel at the bottom of the window, click Copy Log and paste the lines around the problem.
      render: text
