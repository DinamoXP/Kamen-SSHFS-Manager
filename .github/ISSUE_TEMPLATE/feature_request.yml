name: Feature idea
description: Suggest something new or a change
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help with?
      description: The situation where you'd use it.
