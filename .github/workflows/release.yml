# Builds Kamen SSHFS Manager.exe on GitHub's Windows servers, signs it through
# SignPath (once configured), and attaches it to a draft GitHub Release.
#
# Run it by pushing a tag that matches version.json (e.g. v1.5.0), or manually
# from the Actions tab (builds only, no release).
#
# SignPath setup (after the project is approved by SignPath Foundation):
#   Settings → Secrets and variables → Actions
#     Secret:    SIGNPATH_API_TOKEN
#     Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#                SIGNPATH_SIGNING_POLICY_SLUG
# Until those exist, the workflow still builds, but the exe is unsigned.

name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the draft release
  actions: read     # let SignPath download the unsigned artifact

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_NAME: Kamen SSHFS Manager
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check tag matches version.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} doesn't match version.json ($version)"
          }

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.17.0

      - name: Build exe
        run: |
          python tools/make_version_info.py
          pyinstaller --onefile --windowed --name "${{ env.APP_NAME }}" --icon icon.ico --add-data "version.json;." --exclude-module numpy --version-file version_info.txt kamen_sshfs_manager.py

      - name: Upload unsigned exe
        id: upload-unsigned
        uses: actions/upload-artifact@v6
        with:
          name: unsigned
          path: dist/${{ env.APP_NAME }}.exe

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          $signed = "signed/$env:APP_NAME.exe"
          $src = if (Test-Path $signed) { $signed } else { "dist/$env:APP_NAME.exe" }
          Write-Host "Using $src"
          # GitHub turns spaces in release file names into dots, so use the
          # dotted name here too and the checksum file matches the download.
          $exe = ($env:APP_NAME -replace ' ', '.') + '.exe'
          Copy-Item $src "release/$exe"
          $hash = (Get-FileHash "release/$exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File release/SHA256SUMS.txt -Encoding ascii

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: release/

      # Release published on the website first → attach the files and leave it
      # as it is. Tag pushed without a release → create a draft to review.
      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem release).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --draft --title "${{ env.APP_NAME }} $tag" --generate-notes
          }
